  }
  const c = DATA.comparisons[+view];
  return [{ cond: c.a, color: "var(--s1)", band: true, width: 2, role: "A" }, { cond: c.b, color: "var(--s2)", band: true, width: 2, role: "B" }];
}

const tip = document.getElementById("tip");
function showTip(evt, env, series, idx) {
  const g = DATA.curves.grid;
  tip.replaceChildren(el("span", { class: "sub", text: `${env} · ${steps(g[idx])} steps` }));
  const vals = series.map((s) => ({ s, c: DATA.curves.envs[env][s.cond] }))
    .filter(({ c }) => c && isNum(c.mean[idx]))
    .sort((a, b) => b.c.mean[idx] - a.c.mean[idx]);
  for (const { s, c } of vals) {
    tip.append(el("div", { class: "row" }, el("i", { style: `border-color:${s.color}` }),
      el("strong", { text: `${fmt(c.mean[idx])}${isNum(c.ci[idx]) ? ` ± ${fmt(c.ci[idx], 2)}` : ""}` }),
      el("span", { class: "name", text: `${s.role ? s.role + " " : ""}${s.cond} (n=${c.n[idx]})` })));
  }
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  const left = evt.clientX + 16 + r.width > innerWidth ? evt.clientX - r.width - 16 : evt.clientX + 16;
  tip.style.left = `${Math.max(8, left)}px`;
  tip.style.top = `${Math.max(8, Math.min(evt.clientY - 10, innerHeight - r.height - 8))}px`;
}

function chart(env, series, comparison) {
  const W = 340, H = 210, L = 46, R = 10, T = 10, B = 24;
  const grid = DATA.curves.grid, data = DATA.curves.envs[env] ?? {};
  const vals = series.flatMap((s) => {
    const c = data[s.cond]; if (!c) return [];
    return c.mean.flatMap((m, i) => isNum(m) ? [m - (c.ci[i] ?? 0), m + (c.ci[i] ?? 0)] : []);
  });
  const pe = comparison?.per_env[env];
  const fig = el("figure", {}, el("figcaption", {}, env,
    pe ? el("span", { class: "sub", text: `${pe.a > pe.b ? "A" : "B"} ahead · P(A>B) ${fmt(pe.p_a_gt_b, 2)} · Mann–Whitney p ${pval(pe.p_mwu)}` }) : null));
  if (!vals.length) { fig.append(el("p", { class: "howto", text: "No data yet." })); return fig; }
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = (v) => L + (v / M.total_steps) * (W - L - R);
  const Y = (v) => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, tabindex: 0, role: "img", "aria-label": `${M.metric} over env steps on ${env}` });
  for (const t of ticks) {
    svg.append(sv("line", { x1: L, x2: W - R, y1: Y(t), y2: Y(t), class: "gridline" }));
    const tx = sv("text", { x: L - 6, y: Y(t) + 3, "text-anchor": "end" }); tx.textContent = fmt(t); svg.append(tx);
  }
  for (const f of [0, 0.25, 0.5, 0.75, 1]) {
    const tx = sv("text", { x: X(f * M.total_steps), y: H - 6, "text-anchor": f === 0 ? "start" : f === 1 ? "end" : "middle" });
    tx.textContent = steps(f * M.total_steps); svg.append(tx);
  }
  const ordered = [...series].reverse();
  for (const s of ordered) {
    const c = data[s.cond]; if (!c) continue;
    const idx = grid.map((_, i) => i).filter((i) => isNum(c.mean[i]));
    if (s.band) {
      const withCi = idx.filter((i) => isNum(c.ci[i]));
      if (withCi.length > 1) {
        const up = withCi.map((i) => `${X(grid[i])},${Y(c.mean[i] + c.ci[i])}`);
        const dn = withCi.slice().reverse().map((i) => `${X(grid[i])},${Y(c.mean[i] - c.ci[i])}`);
        svg.append(sv("polygon", { points: [...up, ...dn].join(" "), fill: s.color, "fill-opacity": 0.14, stroke: "none" }));
      }
    }
    svg.append(sv("polyline", { points: idx.map((i) => `${X(grid[i])},${Y(c.mean[i])}`).join(" "), fill: "none", stroke: s.color, "stroke-width": s.width, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  }
  const cross = sv("line", { y1: T, y2: H - B, class: "cross", visibility: "hidden" });
  const hit = sv("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" });
  svg.append(cross, hit);
  let cur = grid.length - 1;
  const show = (evt, i) => {
    cur = Math.max(0, Math.min(grid.length - 1, i));
    cross.setAttribute("x1", X(grid[cur])); cross.setAttribute("x2", X(grid[cur]));
    cross.setAttribute("visibility", "visible");
    showTip(evt, env, series, cur);
  };
  const hide = () => { cross.setAttribute("visibility", "hidden"); tip.hidden = true; };
  hit.addEventListener("pointermove", (evt) => {
    const box = svg.getBoundingClientRect();
    const vx = ((evt.clientX - box.left) / box.width) * W;
    const frac = (vx - L) / (W - L - R);
    show(evt, Math.round(frac * grid.length - 1));
  });
  hit.addEventListener("pointerleave", hide);
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", (evt) => {
    if (evt.key !== "ArrowLeft" && evt.key !== "ArrowRight") return;
    evt.preventDefault();
    const box = svg.getBoundingClientRect();
    const i = cur + (evt.key === "ArrowRight" ? 1 : -1);
    show({ clientX: box.left + (X(grid[Math.max(0, Math.min(grid.length - 1, i))]) / W) * box.width, clientY: box.top + box.height / 3 }, i);
  });
  fig.append(svg);
  return fig;
}

function renderCurves() {
  const sec = document.getElementById("curves");
  sec.append(head("curves", "Over training", "Learning curves",
    `Mean ${M.metric} over seeds against env steps, shaded 95% CI. Hover or focus a chart and use the arrow keys to read values.`));
  const select = el("select", { id: "curve-view" });
  DATA.comparisons.forEach((c, i) => select.append(el("option", { value: i, text: `${c.a}  vs  ${c.b}` })));
  select.append(el("option", { value: "all", text: "All conditions" }));
  const legend = el("div", { class: "legend", "aria-label": "Legend" });
  const grid = el("div", { class: "grid" });
  const note = el("p", { class: "howto" });
  const draw = () => {
    const series = seriesFor(select.value);
    legend.replaceChildren(...series.map((s) => el("span", {}, el("i", { style: `border-color:${s.color}` }),
      s.role ? el("strong", { text: s.role }) : null, el("span", { class: "cond", text: s.cond }))));
    note.textContent = select.value === "all" && M.conditions.length > 8
      ? "Conditions after the eighth are drawn as thin grey context lines; reorder `conditions` in experiment.toml to choose which get colour."
      : "";
    const comparison = select.value === "all" ? null : DATA.comparisons[+select.value];
    grid.replaceChildren(...M.envs.map((env) => chart(env, series, comparison)));
  };
  select.addEventListener("change", draw);
  sec.append(el("div", { class: "controls" }, el("label", { for: "curve-view" }, "Show", select)), legend, note, grid);
  draw();
}

function renderSpeed() {
  const sec = document.getElementById("speed");
  const s = DATA.speedup;
  sec.append(head("speed", "Sample efficiency", `Speed to threshold vs ${M.reference}`,
    `A threshold of f is the starting return plus f of ${M.reference}'s improvement on that env. Cell = median over envs of (${M.reference} steps ÷ condition steps); above 1× is faster. "k/N" counts the envs where both reached it with most seeds.`));
  const rows = M.conditions.map((c) => el("tr", {}, el("td", {}, condName(c)),
    s.rows[c].map((r) => el("td", { class: "num" }, isNum(r.median) ? `${r.median.toFixed(2)}×` : "–",
      el("span", { class: "sub", text: `${r.envs}/${s.eligible.length}` })))));
  sec.append(table([{ text: "Condition" }, ...M.thresholds.map((t) => ({ text: `${Math.round(t * 100)}%`, num: 1 }))], rows));
  if (s.skipped.length) sec.append(el("p", { class: "howto", text: `Left out because ${M.reference} did not improve on its start or has no complete runs: ${s.skipped.join(", ")}.` }));
}

function renderSecondary() {
  const sec = document.getElementById("secondary");
  if (!DATA.secondary.length) { sec.remove(); return; }
  sec.append(head("secondary", "Mechanism", "Secondary metrics",
    `Mean over complete runs of the last ${Math.round(M.final_window * 100)}% of training, ± 95% CI, pooled across envs. Blank where a condition does not log the metric.`));
  const headers = [{ text: "Condition" }, ...DATA.secondary.map((m) => ({
    node: el("span", {}, m.label, m.note ? el("span", { class: "sub", text: m.note }) : null), num: 1 }))];
  const rows = M.conditions.map((c) => el("tr", {}, el("td", {}, condName(c)), DATA.secondary.map((m) => {
    const v = m.by_condition[c];
    return el("td", { class: "num" }, v.n ? `${fmt(v.mean)}${isNum(v.ci) ? ` ± ${fmt(v.ci, 2)}` : ""}` : "–",
      v.n ? el("span", { class: "sub", text: `n=${v.n}` }) : null);
  })));
  sec.append(table(headers, rows));
}

function listBlock(title, items, render) {
  if (!items?.length) return null;
  return el("details", {}, el("summary", { text: `${title} (${items.length})` }), el("ul", {}, items.map((it) => el("li", {}, render(it)))));
}

function renderHealth() {
  const sec = document.getElementById("health");
  const h = DATA.health, idx = h.index ?? {};
  sec.append(head("health", "Coverage", "Runs and cluster state",
    `${h.complete} of ${h.expected} expected runs finished their full budget. Wandb data fetched ${idx.fetched?.replace("T", " ") ?? "–"}.`));
  const blocks = [
    listBlock("Not in wandb", h.missing, (m) => m),
    listBlock("Unfinished", h.incomplete, (r) => el("span", {},
      el("a", { href: r.url, target: "_blank", rel: "noopener", text: r.name }), ` ${r.state}, ${Math.round(r.progress * 100)}%`)),
    listBlock("Duplicates ignored", idx.duplicates, (m) => m),
    listBlock("Names not matching wandb.run_name", idx.unparsed, (m) => m),
    listBlock("Tagged runs outside the grid", idx.off_grid, (m) => m),
  ].filter(Boolean);
  if (h.cluster) {
    const rows = h.cluster.jobs.map((j) => el("tr", {},
      el("td", { class: "mono", text: j.id }), el("td", { text: j.label || "–" }),
      el("td", { text: Object.entries(j.states).map(([k, v]) => `${k} ${v}`).join(" · ") || "–" }),
      el("td", { class: "num", text: fmt(j.cpu_h) }), el("td", { class: "num", text: fmt(j.gpu_h) }),
      el("td", { class: "num", text: j.failed.length })));
    sec.append(el("p", { class: "howto", text: `SLURM accounting checked ${h.cluster.checked.replace("T", " ")}.` }),
      table([{ text: "Array job" }, { text: "Label" }, { text: "Task states" }, { text: "CPU-h", num: 1 }, { text: "GPU-h", num: 1 }, { text: "Failed", num: 1 }], rows));
  }
  if (blocks.length) sec.append(...blocks);
  else sec.append(el("p", { text: "Every expected run is present and complete." }));
}

function renderMethod() {
  const sec = document.getElementById("method");
  sec.append(head("method", "Method", "How the numbers are made"));
  const items = [
    `Final score of a run: mean of ${M.metric} (${M.metric_keys.join(" or ")}) over the last ${Math.round(M.final_window * 100)}% of the ${steps(M.total_steps)}-step budget. Runs that stopped before 99% of the budget are excluded.`,
    "Normalization per environment: (score − worst condition mean) ÷ (best − worst). Makes environments with different return scales comparable; depends on which conditions are in the grid.",
    "Aggregate: interquartile mean of normalized run scores, 95% interval from 2000 bootstrap resamples of seeds within each environment.",
    "Comparisons: two-sided Wilcoxon signed-rank test on per-environment differences of normalized means, Holm correction across the planned comparisons, α = 0.05. With fewer than 6 environments the test cannot reach significance and is not run. Per-environment Mann–Whitney p-values over seeds appear above each learning curve in a comparison view; they are uncorrected and do not feed the verdicts.",
    `Steps to threshold: first env step where a 3-eval moving average of the curve reaches the threshold; a condition reaches it on an env when most of its seeds do.`,
  ];
  sec.append(el("ul", { class: "method" }, items.map((t) => el("li", { text: t }))));
}

renderHeader();
renderVerdicts();
renderRanking();
renderEnvTable();
renderCurves();
renderSpeed();
renderSecondary();
renderHealth();
renderMethod();
</script>
