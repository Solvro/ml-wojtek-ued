name = "v2-dr-terrain-validity"
question = "Does PPO with DR physics + randomized hfield learn to walk on the v2 fixed-hfield terrain (sanity/validity baseline before ACCEL)?"

envs = ["validity"]
conditions = ["ppo_dr_terrain"]
seeds = [1234]
total_steps = 400

[wandb]
entity = "dominikgalus9-wroc-aw-university-of-science-and-technology"
project = "wojtyla"
tag = "v2-fixed-hfield"
# eval runs (`..._eval_d<difficulty>`) share the tag and show up as UNPARSED
run_name = '^v2_(?P<condition>ppo_dr_terrain)_(?P<env>validity)_seed(?P<seed>\d+)$'

[metric]
keys = ["mean_reward"]
x = ["iteration"]
label = "mean reward (train)"
final_window = 0.1

[reference]
condition = "ppo_dr_terrain"
thresholds = [0.25, 0.5, 0.75, 0.9]

[[secondary]]
key = "fall_toggle_rate"
label = "fall_toggle_rate"
note = "share of episode ends from toggling over; lower = better"

[[secondary]]
key = "fall_base_contact_rate"
label = "fall_base_contact_rate"
note = "share of episode ends from base touching ground"

[cluster]
ssh_host = "wcss"

[[cluster.jobs]]
id = 6051886
label = "train"

[[cluster.jobs]]
id = 6051887
label = "eval (afterany:6051886)"

[report]
url = ""
