name = "tiled-draft"
question = "Do DR and ACCEL trained on the shared tiled arena (warp) with the paper-draft code reach the v10 paper results for Wojtek and Go1?"

envs = ["wojtek", "go1"]
conditions = ["dr", "accel"]
seeds = [0, 1, 2]
total_steps = 300_000_000

[wandb]
entity = "dominikgalus9-wroc-aw-university-of-science-and-technology"
project = "wojtyla"
tag = "tiled-draft"
run_name = '^td_(?P<env>wojtek|go1)_(?P<condition>.+)_seed(?P<seed>\d+)$'

[metric]
keys = ["eval/d1.0/success_rate"]
x = ["env_steps"]
label = "in-training eval success, d=1.0"
final_window = 0.1

[reference]
condition = "dr"
thresholds = [0.25, 0.5, 0.75, 0.9]

[[comparisons]]
a = "accel"
b = "dr"
question = "ACCEL vs DR on the tiled arena (2 robots: reported, not testable at n_env < 6)"

[[secondary]]
key = "eval/d0.5/success_rate"
label = "eval success, d=0.5"
note = "in-training eval, mid difficulty"

[[secondary]]
key = "falls_per_step"
label = "falls per step"
note = "training rollouts"

[[secondary]]
key = "diverged_per_step"
label = "diverged per step"
note = "env steps ended by the divergence guard"

[[secondary]]
key = "tile_leak_frac"
label = "tile leak fraction"
note = "envs that reached a neighbouring tile; must stay 0"

[cluster]
ssh_host = "wcss"

[report]
url = ""
