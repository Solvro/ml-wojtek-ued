name = "deploy-warmstart"
question = "Does ACCEL fine-tuning in brax_ued, warm-started from upstream's A1-long policy, keep it walking and improve it on the deploy arena?"

envs = ["deploy_ws"]
conditions = ["accel"]
seeds = [0, 1, 2]
total_steps = 150_000_000

[wandb]
entity = "dominikgalus9-wroc-aw-university-of-science-and-technology"
project = "wojtyla"
# added through the wandb API once the runs exist
tag = "deploy-warmstart"
run_name = '^(?P<env>deploy_ws)_(?P<condition>accel)_seed(?P<seed>\d+)$'

[metric]
keys = ["eval/d1.0/success_rate"]
x = ["env_steps"]
label = "success rate, uniform levels d=1.0"
final_window = 0.1

[reference]
condition = "accel"
thresholds = [0.5]

[[secondary]]
key = "falls_per_step"
label = "train falls / step"
note = "go/no-go: stop if > 0.05 by ~30M"

[[secondary]]
key = "eval/d0.25/fall_rate"
label = "eval d0.25 fall rate"
note = "lower = better"

[cluster]
ssh_host = "wcss"

[[cluster.jobs]]
id = 6109816
label = "eval_brax of the imported 305M A1-long (native, no training)"

[[cluster.jobs]]
id = 6109817
label = "train from 305M, cancelled at ~8 min (plan changed to 1.5B)"

[[cluster.jobs]]
id = 6109841
label = "upstream train.py restore 305M -> +1.2B steps"

[[cluster.jobs]]
id = 6109842
label = "import last upstream checkpoint + export + v10 arena build (cpu)"

[[cluster.jobs]]
id = 6109843
label = "train seeds 0-2 from the 1.5B import"

[[cluster.jobs]]
id = 6109844
label = "eval baseline 1.5B (native + v10box) and v10 seed4 (v10box)"

[[cluster.jobs]]
id = 6109845
label = "eval seeds 0-2 (native + v10box, aftercorr:6109843)"

[report]
url = ""
