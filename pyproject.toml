[project]
name = "wojtek-env"
version = "0.1.0"
description = "Wojtek quadruped MJX env + procedural terrain + Gymnasium interface, for UED (PAIRED/ACCEL) research"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    # jax 0.9.2 is the proven pin for this driver family; cuda extra only on linux
    "jax[cuda12]==0.9.2; sys_platform == 'linux'",
    "jax==0.9.2; sys_platform == 'darwin'",
    "mujoco>=3.2.0",
    # mjx pinned: 3.11.0 needs a newer warp-lang than the 1.13.0 pinned
    # below (fresh resolves on rented boxes were picking it up and failing
    # at put_model). 3.10.0 is the proven pair.
    "mujoco-mjx==3.10.0",
    # mujoco-mjx 3.10.0 vendors MJWarp and requires exactly this warp-lang.
    # 1.14 removed warp._src.jax_experimental and breaks put_model(impl="warp").
    "warp-lang==1.13.0",
    "brax>=0.12.1",
    "playground>=0.0.4",
    "ml-collections>=0.1.1",
    "numpy",
    "gymnasium>=1.3.0",
    "ruff>=0.16.2",
    "distrax>=0.1.9",
    "equinox>=0.13.8",
    "flax>=0.12.6",
    "hydra-core>=1.3.5",
    "wandb>=0.28.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.14.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: end-to-end CPU training runs (minutes each)"]
# `pytest -m slow` runs them
addopts = ["-m", "not slow"]
# third-party: brax/distrax import the unmaintained jaxopt at import time;
# mjx's hfield collision writes float64 max into a float32 distance
# (collision_convex._convex_convex)
filterwarnings = [
  "ignore:JAXopt is no longer maintained:DeprecationWarning",
  "ignore:overflow encountered in cast:RuntimeWarning",
]

[[tool.ty.overrides]]
include = ["src/scripts/eval_sim2sim.py", "tests/**"]
# mujoco's bindings are a C extension without stubs, so ty resolves none of
# its members; mujoco.mjx is pure Python and stays checked
analysis.replace-imports-with-any = ["mujoco"]

[tool.ruff]
extend-exclude = ["src/wojtek_env"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wojtek_env"]
