[project]
name = "quadruped-ued-benchmark"
version = "0.1.0"
description = "Unsupervised Environment Design for quadruped locomotion on procedural terrain: 12 UED/DR curricula x 5 quadrupeds"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    # jax 0.9.2 is the proven pin for this driver family; cuda extra only on linux
    "jax[cuda12]==0.9.2; sys_platform == 'linux'",
    "jax==0.9.2; sys_platform == 'darwin'",
    "mujoco>=3.2.0",
    # mjx pinned: 3.11.0 needs a newer warp-lang than the 1.13.0 pinned
    # below (fresh resolves on rented boxes were picking it up and failing
    # at put_model). 3.10.0 is the proven pair.
    "mujoco-mjx==3.10.0",
    # mujoco-mjx 3.10.0 vendors MJWarp and requires exactly this warp-lang.
    # 1.14 removed warp._src.jax_experimental and breaks put_model(impl="warp").
    "warp-lang==1.13.0",
    "brax>=0.12.1",
    "playground>=0.0.4",
    "ml-collections>=0.1.1",
    "numpy",
    "gymnasium>=1.3.0",
    "distrax>=0.1.9",
    "equinox>=0.13.8",
    "optax>=0.2.8",
    "hydra-core>=1.3.5",
    "wandb>=0.28.2",
    "matplotlib>=3.11.1",
    "mediapy>=1.2.7",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    # IQM / stratified bootstrap / probability of improvement (paper_stats)
    "rliable==1.2.0",
    # rliable 1.2.0 caps arch<8, and arch 7.x fails to import on pandas 3
    "pandas==2.3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.16.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: end-to-end CPU training runs (minutes each)"]
# `pytest -m slow` runs them
addopts = ["-m", "not slow"]
# third-party: brax/distrax import the unmaintained jaxopt at import time;
# mjx's hfield collision writes float64 max into a float32 distance
# (collision_convex._convex_convex)
filterwarnings = [
  "ignore:JAXopt is no longer maintained:DeprecationWarning",
  "ignore:overflow encountered in cast:RuntimeWarning",
]

[[tool.ty.overrides]]
include = ["src/evaluation/cpu_physics.py", "src/evaluation/physics_variants.py", "tests/**"]
# mujoco's bindings are a C extension without stubs, so ty resolves none of
# its members; mujoco.mjx is pure Python and stays checked
analysis.replace-imports-with-any = ["mujoco"]

[tool.ruff]
extend-exclude = ["src/wojtek_env"]
line-length = 80

[tool.ruff.lint]
extend-select = ["E501", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
# local wandb/ run dirs would otherwise make ruff sort wandb as first-party
known-third-party = ["wandb"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wojtek_env"]
