defaults:
  - train_schema
  - _self_
  - robot: wojtek
  - mode: ???
  - level_space: param
  - arena: benchmark
  - network: default
  - policy: null

name: ???
entity: ""
project: wojtek-benchmark-iclr
backend: auto
seed: 0
num_timesteps: 300000000
num_lanes: 256
envs_per_lane: 32
level_steps: 300
eval_every: 10
eval_levels: 512
min_travel: 1.0
checkpoint_dir: null
export_dir: artifacts/export
tags: []

# every mode starts from these; mode/<name>.yaml sets its own switches
mode:
  replay_prob: 0.8
  buffer_size: 4000
  generator_scale: 0.1
  mutation: local
  grow_max: 1.3
  score: pvl
  generator: easy
  latent_dim: 16
  gen_learning_rate: 1.0e-4
  gen_entropy_coef: 0.1
  student_entropy_coef: 0.01
  bc: none
  bc_coef: 0.5
  bc_every: 1

# mujoco_playground's locomotion recipe
ppo:
  unroll_length: 20
  num_minibatches: 32
  num_updates_per_batch: 4
  discounting: 0.97
  gae_lambda: 0.95
  learning_rate: 3.0e-4
  clipping_epsilon: 0.2
  max_grad_norm: 1.0

hydra:
  job:
    chdir: false
  run:
    dir: artifacts/hydra/${run_name:}
